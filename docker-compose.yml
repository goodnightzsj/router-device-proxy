services:
  router-device-proxy:
    image: ${DOCKERHUB_USERNAME:-local}/router-device-proxy:latest
    build: .
    container_name: router-device-proxy
    restart: unless-stopped
    # SSDP/UPnP 发现需要 host 网络；ADDR 必须是宿主机空闲端口。
    network_mode: host
    environment:
      # 建议绑定 LAN IP，例如 192.168.31.122:18099
      ADDR: ${ADDR:-:8090}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ROUTER_HOST: ${ROUTER_HOST:-192.168.31.1}
      ROUTER_USER: ${ROUTER_USER:-root}
      ROUTER_WEB_PASSWORD: ${ROUTER_WEB_PASSWORD:-}
      PROXY_GATEWAY: ${PROXY_GATEWAY:-192.168.31.122}
      ROUTER_LEASE_FILE: ${ROUTER_LEASE_FILE:-/tmp/dhcp.leases}
      DISCOVERY: ${DISCOVERY:-true}
      DISCOVERY_SSDP: ${DISCOVERY_SSDP:-true}
      DISCOVERY_TIMEOUT: ${DISCOVERY_TIMEOUT:-2s}
      DATA_DIR: /data
      # MOCK: "1"
    volumes:
      - ./data:/data
